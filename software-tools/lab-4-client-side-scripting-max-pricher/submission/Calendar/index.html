<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./resources/css/style.css">
</head>

<body>
    <main>
        <div class="modal" id="event_modal" tabindex="-1"> <!-- Modal for creating/editing events-->
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Create Event</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body"> <!-- This is the main wrapper for the event form -->
                        <form id="create_event_form" novalidate>
                            <!-- input fields -->
                            <div class="mb-3">
                                <label for="event_name" class="form-label">Event Name</label>
                                <input type="text" class="form-control" id="event_name" placeholder="Enter event name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="event_category" class="form-label">Category</label>
                                <select class="form-select" id="event_category" required>
                                    <option value="" selected disabled>Select category</option>
                                    <option value="Academic">Academic</option>
                                    <option value="Work">Work</option>
                                    <option value="Personal">Personal</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="event_weekday" class="form-label">Weekday</label>
                                    <select class="form-select" id="event_weekday" required>
                                        <option value="" selected disabled>Select day</option>
                                        <option value="Monday">Monday</option>
                                        <option value="Tuesday">Tuesday</option>
                                        <option value="Wednesday">Wednesday</option>
                                        <option value="Thursday">Thursday</option>
                                        <option value="Friday">Friday</option>
                                        <option value="Saturday">Saturday</option>
                                        <option value="Sunday">Sunday</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="event_time" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="event_time" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="event_modality" class="form-label">Event Modality</label>
                                <select class="form-select" id="event_modality"
                                    onchange="updateLocationOptions(this.value)" required>
                                    <option value="" selected disabled>Select modality</option>
                                    <option value="in-person">In Person</option>
                                    <option value="remote">Remote</option>
                                </select>
                            </div>

                            <div class="mb-3 d-none" id="location_wrapper">
                                <label for="event_location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="event_location"
                                    placeholder="e.g. Conference Room A" required>
                            </div>

                            <div class="mb-3 d-none" id="remote_url_wrapper">
                                <label for="event_remote_url" class="form-label">Remote URL</label>
                                <input id="event_remote_url" type="url" class="form-control" pattern="https?://.+\..+"
                                    placeholder="https://zoom.us/j/123" required />
                            </div>

                            <div class="mb-3 d-none" id="attendees_wrapper">
                                <label for="event_attendees" class="form-label">Attendees</label>
                                <input type="text" class="form-control" id="event_attendees"
                                    placeholder="Separate names with commas (e.g. Alice, Bob)">
                            </div>
                        </form>
                    </div>
                    <!-- close/save buttons -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button class="btn btn-primary" type="button" onclick="saveEvent()">Save Event</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- calendar gui, elements will by dyanmically added with js -->
        <div class="row">
            <div class="col-2">
                <div class="custom-container">
                    <button class="btn btn-primary mt-3" id="event_button" data-bs-toggle="modal"
                        data-bs-target="#event_modal" onclick="currentEditIndex = null">
                        Create Event
                    </button>
                </div>
            </div>
            <div class="col">
                <div class="container-md container-fluid py-4 h-100">
                    <div id="calendar" class="row h-100">
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                            <div class="h6 text-center position-relative py-2 day">
                                Sunday
                            </div>
                        </div>
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                            <div class="h6 text-center position-relative py-2 day">
                                Monday
                            </div>
                        </div>
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                            <div class="h6 text-center position-relative py-2 day">
                                Tuesday
                            </div>
                        </div>
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                            <div class="h6 text-center position-relative py-2 day">
                                Wednesday
                            </div>
                        </div>
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                            <div class="h6 text-center position-relative py-2 day">
                                Thursday
                            </div>
                        </div>
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                            <div class="h6 text-center position-relative py-2 day">
                                Friday
                            </div>
                        </div>
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                            <div class="h6 text-center position-relative py-2 day">
                                Saturday
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="./resources/js/script.js"> </script>
</body>

</html>
